name: CI

on:
    push:
        # Tags too: a release is cut by pushing one, and Packagist imports it immediately —
        # so the tagged tree is exactly what needs a green run, not just the branch it came from.
        branches: [main]
        tags: ['v*']
    pull_request:

jobs:
    tests:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - php: '8.4'
                      symfony: '7.4.*'
                    - php: '8.4'
                      symfony: '8.0.*'
                    - php: '8.5'
                      symfony: '7.4.*'
                    - php: '8.5'
                      symfony: '8.0.*'
                    - php: '8.4'
                      symfony: '7.4.*'
                      dependencies: lowest
        services:
            mongo:
                image: mongo:8
                ports: ['27017:27017']
                options: >-
                    --health-cmd "mongosh --quiet --eval 'db.runCommand({ping: 1})'"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
                    --health-start-period 10s
        env:
            MONGODB_URI: mongodb://127.0.0.1:27017
        steps:
            - uses: actions/checkout@v4

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: mongodb
                  coverage: none

            - run: composer global require --no-progress --no-scripts --no-plugins symfony/flex

            - name: Restrict Symfony version
              run: |
                  composer global config --no-plugins allow-plugins.symfony/flex true
                  composer config extra.symfony.require "${{ matrix.symfony }}"

            - name: Install dependencies
              run: |
                  if [ "${{ matrix.dependencies }}" = "lowest" ]; then
                      composer update --prefer-lowest --prefer-stable --no-progress
                  else
                      composer update --no-progress
                  fi

            - run: vendor/bin/phpunit

    static:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: mongodb
                  coverage: none
            # Packagist rejects a release whose composer.json fails this, and it does so
            # AFTER the tag is pushed — so it has to be a gate here, not a lesson there.
            # --no-check-lock because composer.lock is deliberately not committed.
            - run: composer validate --strict --no-check-lock
            - run: composer update --no-progress
            - run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G
            - run: vendor/bin/php-cs-fixer check --diff
