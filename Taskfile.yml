version: '3'

vars:
    PHP: docker compose exec -T -u $(id -u):$(id -g) php

tasks:
    up:
        cmds:
            - docker compose up -d
            - '{{.PHP}} composer install'
    down:
        cmds: [docker compose down -v]
    shell:
        interactive: true
        cmds: [docker compose exec -u $(id -u):$(id -g) php sh]
    test:
        desc: Full gate
        cmds: [task: test:cs, task: test:stan, task: test:phpunit]
    test:phpunit:
        cmds: ['{{.PHP}} vendor/bin/phpunit {{.CLI_ARGS}}']
    test:stan:
        # Level max peaks at ~124 MB against the image's 128M memory_limit — 3 MB of
        # headroom, so whether the gate passes depends on result-cache state rather than on
        # the code. Pinned high so a new file is a PHPStan error, never an OOM.
        cmds: ['{{.PHP}} vendor/bin/phpstan analyse --memory-limit=1G']
    test:cs:
        cmds: ['{{.PHP}} vendor/bin/php-cs-fixer check --diff']
    test:cs-fix:
        cmds: ['{{.PHP}} vendor/bin/php-cs-fixer fix']
